services:
  dj4ghub:
    build:
      context: ../..
      dockerfile: packaging/qnap/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io}
    image: dj4ghub:qnap-amd64
    container_name: dj4ghub
    restart: unless-stopped
    privileged: true
    ports:
      - "${DJ4GHUB_BIND:-127.0.0.1}:7575:7575"
    volumes:
      - /share/Container/dj4ghub:/data

# The private Baiwang 2ca3:4006 USB interface is not a ttyUSB device. The
# privileged setting is intentional for the native private USB transport and
# USB Audio device access. The UI remains localhost-only on the NAS unless an
# explicit, trusted LAN address is supplied as DJ4GHUB_BIND. Do not expose
# port 7575 to the public internet.
